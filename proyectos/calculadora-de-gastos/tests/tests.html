<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧪 Tests — Calculadora de Gastos</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;padding:24px;min-height:100vh}
    .wrap{max-width:800px;margin:0 auto}
    h1{font-size:1.5rem;margin-bottom:8px;color:#818cf8}
    .sub{color:#94a3b8;font-size:.85rem;margin-bottom:24px}
    .summary{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
    .stat{background:#1e293b;border-radius:12px;padding:16px 24px;text-align:center;flex:1;min-width:120px}
    .stat .num{font-size:1.8rem;font-weight:800}
    .stat .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;margin-top:4px}
    .pass .num{color:#34d399}
    .fail .num{color:#f87171}
    .total .num{color:#818cf8}
    .test{background:#1e293b;border-radius:10px;padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:12px;border-left:4px solid #334155}
    .test.pass{border-left-color:#34d399}
    .test.fail{border-left-color:#f87171}
    .test .icon{font-size:1.2rem}
    .test .name{flex:1;font-size:.9rem}
    .test .detail{font-size:.75rem;color:#94a3b8;margin-top:2px}
    .test .time{font-size:.7rem;color:#64748b}
    .btn{background:#6366f1;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:.9rem;font-weight:600;cursor:pointer;margin-bottom:20px}
    .btn:hover{background:#818cf8}
    .group{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#818cf8;margin:20px 0 10px}
  </style>
</head>
<body>
<div class="wrap">
  <h1>🧪 Tests Unitarios — Calculadora de Gastos</h1>
  <p class="sub">Verifica la lógica de cálculos, formato de montos, ciclos mensuales y la calculadora</p>

  <button class="btn" onclick="runAll()">▶ Ejecutar todos los tests</button>

  <div class="summary">
    <div class="stat total"><div class="num" id="sTotal">0</div><div class="lbl">Total</div></div>
    <div class="stat pass"><div class="num" id="sPass">0</div><div class="lbl">Pasados</div></div>
    <div class="stat fail"><div class="num" id="sFail">0</div><div class="lbl">Fallidos</div></div>
  </div>

  <div id="results"></div>
</div>

<script>
// ══════════════════════════════════════
// TEST FRAMEWORK MINIMALISTA
// ══════════════════════════════════════
let tests = [];
let results = [];

function test(name, fn) {
  tests.push({ name, fn });
}

function runAll() {
  results = [];
  const start = performance.now();
  tests.forEach(t => {
    try {
      t.fn();
      results.push({ name: t.name, pass: true, detail: 'OK', time: (performance.now() - start).toFixed(1) });
    } catch (e) {
      results.push({ name: t.name, pass: false, detail: e.message, time: (performance.now() - start).toFixed(1) });
    }
  });
  render();
}

function assert(cond, msg) {
  if (!cond) throw new Error(msg || 'Assertion failed');
}
function assertEq(a, b, msg) {
  if (a !== b) throw new Error((msg || '') + ` — esperado: ${JSON.stringify(b)}, obtenido: ${JSON.stringify(a)}`);
}
function assertClose(a, b, tol, msg) {
  if (Math.abs(a - b) > (tol || 0.001)) throw new Error((msg || '') + ` — esperado: ${b}, obtenido: ${a}`);
}

function render() {
  const pass = results.filter(r => r.pass).length;
  const fail = results.length - pass;
  document.getElementById('sTotal').textContent = results.length;
  document.getElementById('sPass').textContent = pass;
  document.getElementById('sFail').textContent = fail;

  let html = '';
  let lastGroup = '';
  results.forEach(r => {
    const group = r.name.split(' › ')[0];
    if (group !== lastGroup) {
      html += `<div class="group">${group}</div>`;
      lastGroup = group;
    }
    html += `<div class="test ${r.pass ? 'pass' : 'fail'}">
      <div class="icon">${r.pass ? '✅' : '❌'}</div>
      <div>
        <div class="name">${r.name}</div>
        <div class="detail">${r.detail}</div>
      </div>
      <div class="time">${r.time}ms</div>
    </div>`;
  });
  document.getElementById('results').innerHTML = html;
}

// ══════════════════════════════════════
// FUNCIONES A TESTEAR (copiadas de app.js)
// ══════════════════════════════════════
const fmt = n => '$' + Math.round(Math.abs(n)).toLocaleString('es-CL');

function getRawValue(str) {
  const v = String(str).replace(/\./g,'').replace(',','.');
  return parseFloat(v) || 0;
}

function setupFmtLogic(raw) {
  const digits = String(raw).replace(/\D/g,'');
  if (!digits) return '';
  return parseInt(digits,10).toLocaleString('es-CL');
}

// Ciclo mensual
let cycleStartDay = 1;
function getCycleForDate(date) {
  const day = date.getDate();
  let month, year;
  if (cycleStartDay === 1) {
    month = date.getMonth();
    year = date.getFullYear();
  } else {
    if (day < cycleStartDay) {
      const prev = new Date(date.getFullYear(), date.getMonth() - 1, 1);
      month = prev.getMonth();
      year = prev.getFullYear();
    } else {
      month = date.getMonth();
      year = date.getFullYear();
    }
  }
  return { month, year };
}

function isInCycle(ts, targetMonth, targetYear) {
  const d = new Date(ts);
  if (cycleStartDay === 1) {
    return d.getMonth() === targetMonth && d.getFullYear() === targetYear;
  }
  const cycleStart = new Date(targetYear, targetMonth, cycleStartDay);
  const cycleEnd = new Date(targetYear, targetMonth + 1, cycleStartDay);
  return d >= cycleStart && d < cycleEnd;
}

// Calculadora
function calcEvaluate(expr) {
  try {
    let cleanExpr = expr.replace(/[+\-×÷−]$/, '');
    if (!cleanExpr) return null;
    const e = cleanExpr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
    const result = Function('"use strict"; return (' + e + ')')();
    return isFinite(result) ? parseFloat(result.toFixed(10)) : null;
  } catch (e) {
    return null;
  }
}

// Distribución proporcional
function calcularDistribucion(ints, gastos) {
  const tg = gastos.reduce((s, g) => s + g.v, 0);
  const ti = ints.reduce((s, i) => s + i.v, 0);
  if (ti === 0) return [];
  return ints.map(i => {
    const p = i.v / ti;
    const a = tg * p;
    const sob = i.v - a;
    return { nombre: i.n, proporcion: p, aporte: a, sobrante: sob };
  });
}

// Metas financieras
function calcularMetas(ingresos) {
  return {
    ahorro: ingresos * 0.1,
    gustos: ingresos * 0.2,
    fijos: ingresos * 0.7,
    emergencia: ingresos * 4,
    inversion: ingresos * 200
  };
}

// ══════════════════════════════════════
// TESTS
// ══════════════════════════════════════

// ── Formato de montos ──
test('Formato › Formatea 1000 como $1.000', () => {
  assertEq(fmt(1000), '$1.000');
});
test('Formato › Formatea 1000000 como $1.000.000', () => {
  assertEq(fmt(1000000), '$1.000.000');
});
test('Formato › Formatea 0 como $0', () => {
  assertEq(fmt(0), '$0');
});
test('Formato › Formatea negativo con valor absoluto', () => {
  assertEq(fmt(-500), '$500');
});
test('Formato › setupFmt convierte "1234" a "1.234"', () => {
  assertEq(setupFmtLogic('1234'), '1.234');
});
test('Formato › setupFmt con vacio devuelve vacio', () => {
  assertEq(setupFmtLogic(''), '');
});
test('Formato › getRawValue convierte "1.234" a 1234', () => {
  assertEq(getRawValue('1.234'), 1234);
});
test('Formato › getRawValue convierte "1.234,56" a 1234.56', () => {
  assertEq(getRawValue('1.234,56'), 1234.56);
});
test('Formato › getRawValue con texto devuelve 0', () => {
  assertEq(getRawValue('abc'), 0);
});

// ── Ciclo mensual ──
test('Ciclo › Con ciclo=1, 15 de marzo pertenece a marzo', () => {
  cycleStartDay = 1;
  const r = getCycleForDate(new Date(2026, 2, 15));
  assertEq(r.month, 2);
  assertEq(r.year, 2026);
});
test('Ciclo › Con ciclo=26, 10 de marzo pertenece a febrero', () => {
  cycleStartDay = 26;
  const r = getCycleForDate(new Date(2026, 2, 10));
  assertEq(r.month, 1); // febrero
  assertEq(r.year, 2026);
});
test('Ciclo › Con ciclo=26, 28 de marzo pertenece a marzo', () => {
  cycleStartDay = 26;
  const r = getCycleForDate(new Date(2026, 2, 28));
  assertEq(r.month, 2); // marzo
});
test('Ciclo › isInCycle con ciclo=1 y fecha en el mes', () => {
  cycleStartDay = 1;
  const ts = new Date(2026, 2, 15).getTime();
  assert(isInCycle(ts, 2, 2026));
  assert(!isInCycle(ts, 1, 2026));
});
test('Ciclo › isInCycle con ciclo=26 y fecha antes del dia 26', () => {
  cycleStartDay = 26;
  const ts = new Date(2026, 2, 10).getTime(); // 10 marzo
  assert(isInCycle(ts, 1, 2026)); // pertenece a ciclo de febrero
  assert(!isInCycle(ts, 2, 2026)); // no pertenece a marzo
});

// ── Calculadora ──
test('Calculadora › 2+2 = 4', () => {
  assertEq(calcEvaluate('2+2'), 4);
});
test('Calculadora › 10×5 = 50', () => {
  assertEq(calcEvaluate('10×5'), 50);
});
test('Calculadora › 100÷4 = 25', () => {
  assertEq(calcEvaluate('100÷4'), 25);
});
test('Calculadora › 10−3 = 7', () => {
  assertEq(calcEvaluate('10−3'), 7);
});
test('Calculadora › 2+3×4 = 14 (precedencia)', () => {
  assertEq(calcEvaluate('2+3×4'), 14);
});
test('Calculadora › (2+3)×4 = 20', () => {
  assertEq(calcEvaluate('(2+3)×4'), 20);
});
test('Calculadora › 10% = 0.1', () => {
  assertEq(calcEvaluate('10%'), 0.1);
});
test('Calculadora › 50% de 200 = 100', () => {
  assertEq(calcEvaluate('200×50%'), 100);
});
test('Calculadora › Division por cero devuelve null', () => {
  assertEq(calcEvaluate('5÷0'), null);
});
test('Calculadora › Expresion vacia devuelve null', () => {
  assertEq(calcEvaluate(''), null);
});
test('Calculadora › Operador final se elimina', () => {
  assertEq(calcEvaluate('5+'), 5);
});
test('Calculadora › Decimales: 0.1+0.2 = 0.3', () => {
  assertClose(calcEvaluate('0.1+0.2'), 0.3, 0.0001);
});

// ── Distribución proporcional ──
test('Distribucion › 2 integrantes con ingresos iguales pagan 50% cada uno', () => {
  const ints = [{ n: 'A', v: 500000 }, { n: 'B', v: 500000 }];
  const gastos = [{ v: 200000 }];
  const r = calcularDistribucion(ints, gastos);
  assertEq(r.length, 2);
  assertClose(r[0].proporcion, 0.5, 0.001);
  assertClose(r[0].aporte, 100000, 0.001);
  assertClose(r[1].aporte, 100000, 0.001);
});
test('Distribucion › Integrante con mas ingreso paga mas', () => {
  const ints = [{ n: 'A', v: 300000 }, { n: 'B', v: 100000 }];
  const gastos = [{ v: 200000 }];
  const r = calcularDistribucion(ints, gastos);
  assert(r[0].aporte > r[1].aporte);
  assertClose(r[0].aporte, 150000, 0.001);
  assertClose(r[1].aporte, 50000, 0.001);
});
test('Distribucion › Suma de aportes = total gastos', () => {
  const ints = [{ n: 'A', v: 400000 }, { n: 'B', v: 300000 }, { n: 'C', v: 300000 }];
  const gastos = [{ v: 250000 }];
  const r = calcularDistribucion(ints, gastos);
  const totalAportes = r.reduce((s, x) => s + x.aporte, 0);
  assertClose(totalAportes, 250000, 0.001);
});
test('Distribucion › Sin ingresos devuelve array vacio', () => {
  const r = calcularDistribucion([], [{ v: 100 }]);
  assertEq(r.length, 0);
});
test('Distribucion › Sobrante = ingreso - aporte', () => {
  const ints = [{ n: 'A', v: 500000 }];
  const gastos = [{ v: 200000 }];
  const r = calcularDistribucion(ints, gastos);
  assertClose(r[0].sobrante, 300000, 0.001);
});

// ── Metas financieras ──
test('Metas › Con sueldo 1.000.000, ahorro = 100.000', () => {
  const m = calcularMetas(1000000);
  assertEq(m.ahorro, 100000);
});
test('Metas › Con sueldo 1.000.000, gustos = 200.000', () => {
  const m = calcularMetas(1000000);
  assertEq(m.gustos, 200000);
});
test('Metas › Con sueldo 1.000.000, fijos = 700.000', () => {
  const m = calcularMetas(1000000);
  assertEq(m.fijos, 700000);
});
test('Metas › Con sueldo 1.000.000, emergencia = 4.000.000', () => {
  const m = calcularMetas(1000000);
  assertEq(m.emergencia, 4000000);
});
test('Metas › Con sueldo 1.000.000, inversion = 200.000.000', () => {
  const m = calcularMetas(1000000);
  assertEq(m.inversion, 200000000);
});
test('Metas › Con sueldo 0, todas las metas son 0', () => {
  const m = calcularMetas(0);
  assertEq(m.ahorro, 0);
  assertEq(m.gustos, 0);
  assertEq(m.fijos, 0);
  assertEq(m.emergencia, 0);
  assertEq(m.inversion, 0);
});

// ── Categorías ──
test('Categorias › Categorias fijas base incluyen Vivienda', () => {
  const fijos = ['Vivienda', 'Alimentacion', 'Transporte', 'Servicios', 'Educacion', 'Salud'];
  assert(fijos.includes('Vivienda'));
  assert(fijos.includes('Salud'));
});
test('Categorias › Categorias gustos incluyen Entretenimiento', () => {
  const gustos = ['Entretenimiento', 'Ropa'];
  assert(gustos.includes('Entretenimiento'));
  assert(gustos.includes('Ropa'));
});

// ── CSV ──
test('CSV › Escapa comillas dobles en descripcion', () => {
  const desc = 'Cafe "especial"';
  const escaped = desc.replace(/"/g, '""');
  assertEq(escaped, 'Cafe ""especial""');
});
test('CSV › Monto negativo para gastos', () => {
  const m = { t: 'gasto', v: 5000 };
  const monto = m.t === 'ingreso' ? m.v : -m.v;
  assertEq(monto, -5000);
});
test('CSV › Monto positivo para ingresos', () => {
  const m = { t: 'ingreso', v: 5000 };
  const monto = m.t === 'ingreso' ? m.v : -m.v;
  assertEq(monto, 5000);
});

// ── Presupuestos ──
test('Presupuesto › Porcentaje usado se calcula correctamente', () => {
  const limit = 100000;
  const spent = 25000;
  const pct = Math.min((spent / limit) * 100, 100);
  assertEq(pct, 25);
});
test('Presupuesto › Porcentaje se limita a 100', () => {
  const limit = 100000;
  const spent = 150000;
  const pct = Math.min((spent / limit) * 100, 100);
  assertEq(pct, 100);
});
test('Presupuesto › Superado muestra alerta', () => {
  const limit = 100000;
  const spent = 120000;
  const pct = Math.min((spent / limit) * 100, 100);
  assert(pct >= 100);
});

// ── Backup ──
test('Backup › Serializa y deserializa datos', () => {
  const data = { integrantes: [{ n: 'A', v: 100 }], movimientos: [{ d: 'x', v: 50 }] };
  const json = JSON.stringify(data);
  const parsed = JSON.parse(json);
  assertEq(parsed.integrantes.length, 1);
  assertEq(parsed.movimientos[0].v, 50);
});
test('Backup › Validacion de archivo invalido', () => {
  const data = { foo: 'bar' };
  const valid = data.movimientos || data.integrantes;
  assert(!valid);
});

// ── Búsqueda ──
test('Busqueda › Filtra por descripcion (case insensitive)', () => {
  const movs = [{ d: 'Arriendo', c: 'Vivienda' }, { d: 'Sueldo', c: 'Sueldo' }];
  const q = 'arriendo';
  const fil = movs.filter(m => (m.d || '').toLowerCase().includes(q) || (m.c || '').toLowerCase().includes(q));
  assertEq(fil.length, 1);
  assertEq(fil[0].d, 'Arriendo');
});
test('Busqueda › Filtra por categoria', () => {
  const movs = [{ d: 'Pan', c: 'Alimentacion' }, { d: 'Bencina', c: 'Transporte' }];
  const q = 'alimentacion';
  const fil = movs.filter(m => (m.d || '').toLowerCase().includes(q) || (m.c || '').toLowerCase().includes(q));
  assertEq(fil.length, 1);
  assertEq(fil[0].c, 'Alimentacion');
});
test('Busqueda › Sin resultados devuelve vacio', () => {
  const movs = [{ d: 'Pan', c: 'Alimentacion' }];
  const q = 'zzz';
  const fil = movs.filter(m => (m.d || '').toLowerCase().includes(q) || (m.c || '').toLowerCase().includes(q));
  assertEq(fil.length, 0);
});

// ── Confirmación de eliminación ──
test('Eliminar › Filtra correctamente por id', () => {
  const movs = [{ id: 1, d: 'A' }, { id: 2, d: 'B' }, { id: 3, d: 'C' }];
  const id = 2;
  const result = movs.filter(m => m.id !== id);
  assertEq(result.length, 2);
  assert(!result.some(m => m.id === 2));
});

// ── Clonar fijos ──
test('Clonar › Detecta duplicados por descripcion y monto', () => {
  const movs = [{ d: 'Arriendo', v: 500000, ts: new Date(2026, 2, 5).getTime() }];
  const exists = movs.some(exist => {
    return exist.d === 'Arriendo' && exist.v === 500000;
  });
  assert(exists);
});
test('Clonar › No duplica si ya existe', () => {
  const movs = [{ d: 'Arriendo', v: 500000 }];
  const fijos = [{ d: 'Arriendo', v: 500000 }];
  let count = 0;
  fijos.forEach(m => {
    const exists = movs.some(exist => exist.d === m.d && exist.v === m.v);
    if (!exists) count++;
  });
  assertEq(count, 0);
});

// ══════════════════════════════════════
// AUTO-EJECUTAR AL CARGAR
// ══════════════════════════════════════
runAll();
</script>
</body>
</html>
